# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR review settings. AGENTS.md and similar guideline files are read as the coding guidelines.
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    ignore_usernames:
      - dependabot[bot]
  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
  pre_merge_checks:
    title:
      mode: warning
    description:
      mode: warning
  path_instructions:
    - path: "src/**"
      instructions: >-
        Latte 3 extension published on Packagist. Flag changes that weaken secure defaults (HTML-safe JSON output),
        break public filter names or options without a SemVer note, or would fail PHPStan level max.
    - path: "src/DI/**"
      instructions: Nette DI extension. Check that registration still works with and without the DI container (latte-lint).
    - path: "tests/**"
      instructions: >-
        Nette Tester tests. Snapshot changes under tests/Integration/__snapshots__ must match an intended behaviour
        change in src.
    - path: "tests/**/*Test.php"
      instructions: >-
        Nette Tester test cases (classes extending Tester\TestCase); each file must end with ->run(). Standalone
        scripts such as tests/latte-lint-runner.php and helpers such as tests/bootstrap.php are not test cases.
knowledge_base:
  code_guidelines:
    enabled: true
chat:
  auto_reply: true
