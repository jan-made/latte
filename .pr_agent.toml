# PR-Agent settings for this repository. PR-Agent reads this file from the
# default branch (main). It also reads AGENTS.md as review context.
# Options: https://github.com/The-PR-Agent/pr-agent/blob/v0.50.0/pr_agent/settings/configuration.toml

[github_app]
# Review draft pull requests too, and run /describe and /review again on every push.
feedback_on_draft_pr = true
handle_push_trigger = true

[pr_reviewer]
num_max_findings = 5
extra_instructions = """\
AGENTS.md is already in your context. Also check these rules:

Filters (src/TrejjamLatteExtension.php):
- `jsonFilter` returns `Html` only in HTML-safe mode, which stays the default outside JavaScript. With `!html` it returns a string and sets `$info->contentType` to `ContentType::JavaScript`. Flag any path that puts unescaped JSON into HTML.
- Option `case` labels are lowercase (`'forceobjects'`) because each option passes through `strtolower(trim())`.
- A new, renamed or removed filter in `getFilters()` or filter option updates "Available Filters" in README.md. A rename or removal is called out as a breaking change.

DI (src/DI/LatteExtension.php):
- `beforeCompile()` returns without error when `latte.latteFactory` is missing and handles both `FactoryDefinition` and `ServiceDefinition`. `TrejjamLatteExtension` keeps a constructor without arguments, because `tests/latte-lint-runner.php` creates it without DI.

Tests and CI:
- A changed snapshot under `tests/Integration/__snapshots__/` matches an intended behaviour change in `src/`. A snapshot change without one is a regression.
- A new template under `tests/fixtures/` passes `make latte-lint`, which uses strict parsing.
- ECS and PHPStan check only `src/`. Check `declare(strict_types=1);`, tab indentation and return-type spacing in `tests/` by reading the diff.
- A change to the `php` constraint in `composer.json` updates the `php-version` matrices in `.github/workflows/ci.yaml`.
"""

[pr_code_suggestions]
# Publish only suggestions scored 5 or higher (0-10).
suggestions_score_threshold = 5
extra_instructions = "Prefer existing project helpers and patterns over new abstractions. Do not suggest edits to snapshots under tests/Integration/__snapshots__; UPDATE_SNAPSHOTS=1 regenerates them."

[ignore]
# Generated code and lock files. Replaces the default list; keep vendor/** first.
glob = [
    "vendor/**",
]
